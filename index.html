<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00302B">
<title>웅심옹심: 미라클 원투</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="웅심옹심">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <canvas id="ui"></canvas>
</div>

<div id="touch" aria-hidden="true">
  <div id="stickZone"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button id="bPass" type="button"><b>패스</b><small>원투!</small></button>
    <button id="bShoot" type="button"><b>슛</b><small>길게 = 강슛</small></button>
  </div>
  <button id="bPause" type="button">Ⅱ</button>
  <div id="rotateHint">📱↻ 가로로 돌리면 화면이 커져요</div>
</div>

<noscript>이 게임은 JavaScript가 필요합니다.</noscript>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/match.js"></script>
<script src="js/render.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
